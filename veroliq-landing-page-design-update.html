  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n\n\n<style>\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --navy:    #0C1829;\n    --navy2:   #0F2140;\n    --blue:    #1A56DB;\n    --blue2:   #2563EB;\n    --blue-light: #3B82F6;\n    --blue-glow: rgba(26,86,219,0.18);\n    --surface: #F5F7FB;\n    --white:   #FFFFFF;\n    --white-dim: rgba(255,255,255,0.08);\n    --white-mid: rgba(255,255,255,0.55);\n    --muted:   #8899AA;\n    --slate:   #3D5068;\n    --text:    #0C1829;\n    --text2:   #4A5568;\n    --border:  rgba(26,86,219,0.12);\n    --border-dark: rgba(255,255,255,0.09);\n    --radius:  12px;\n    --radius-lg: 20px;\n    --shadow:  0 4px 24px rgba(12,24,41,0.10);\n    --shadow-card: 0 2px 12px rgba(12,24,41,0.08), 0 12px 40px rgba(12,24,41,0.06);\n    --shadow-blue: 0 8px 40px rgba(26,86,219,0.25);\n  }\n\n  html { scroll-behavior: smooth; }\n  body {\n    font-family: 'Inter', sans-serif;\n    background: var(--white);\n    color: var(--text);\n    line-height: 1.6;\n    overflow-x: hidden;\n    -webkit-font-smoothing: antialiased;\n  }\n\n  /* ── TYPOGRAPHY ── */\n  h1,h2,h3,h4,h5 { font-family: 'Sora', sans-serif; line-height: 1.15; letter-spacing: -0.02em; }\n  h1 { font-size: clamp(2.6rem, 5.5vw, 4.2rem); font-weight: 800; }\n  h2 { font-size: clamp(1.9rem, 3.5vw, 2.8rem); font-weight: 700; }\n  h3 { font-size: 1.25rem; font-weight: 600; }\n  p  { color: var(--text2); line-height: 1.7; }\n\n  /* ── LAYOUT ── */\n  .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }\n  .section { padding: 100px 0; }\n  .section-sm { padding: 72px 0; }\n  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }\n  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }\n  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }\n\n  /* ── BUTTONS ── */\n  .btn {\n    display: inline-flex; align-items: center; gap: 8px;\n    padding: 13px 26px; border-radius: 8px;\n    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;\n    cursor: pointer; transition: all 0.2s ease; border: none; text-decoration: none;\n  }\n  .btn-primary {\n    background: var(--blue); color: #fff;\n    box-shadow: 0 2px 12px rgba(26,86,219,0.30);\n  }\n  .btn-primary:hover { background: #1548c0; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,86,219,0.40); }\n  .btn-ghost {\n    background: transparent; color: var(--text);\n    border: 1.5px solid rgba(12,24,41,0.15);\n  }\n  .btn-ghost:hover { border-color: var(--blue); color: var(--blue); }\n  .btn-ghost-white {\n    background: rgba(255,255,255,0.10); color: #fff;\n    border: 1.5px solid rgba(255,255,255,0.20);\n    backdrop-filter: blur(8px);\n  }\n  .btn-ghost-white:hover { background: rgba(255,255,255,0.18); }\n  .btn-lg { padding: 16px 32px; font-size: 16px; border-radius: 10px; }\n  .btn-sm { padding: 9px 18px; font-size: 13px; border-radius: 7px; }\n  .btn svg { flex-shrink: 0; }\n\n  /* ── BADGE ── */\n  .badge {\n    display: inline-flex; align-items: center; gap: 6px;\n    padding: 5px 14px; border-radius: 100px;\n    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;\n  }\n  .badge-blue { background: rgba(26,86,219,0.10); color: var(--blue); }\n  .badge-white { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.15); }\n  .badge-dot::before { content: ''; display: block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }\n  .badge-green { background: rgba(16,185,129,0.12); color: #10B981; }\n\n  /* ─────────────────────────────────────── NAV ─── */\n  nav {\n    position: fixed; top: 0; left: 0; right: 0; z-index: 100;\n    padding: 0 24px;\n    transition: all 0.3s ease;\n  }\n  nav.scrolled {\n    background: rgba(12,24,41,0.94);\n    backdrop-filter: blur(16px);\n    border-bottom: 1px solid var(--border-dark);\n    box-shadow: 0 2px 20px rgba(0,0,0,0.25);\n  }\n  .nav-inner {\n    max-width: 1160px; margin: 0 auto;\n    display: flex; align-items: center; gap: 0;\n    height: 68px;\n  }\n  .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }\n  .nav-logo img { height: 32px; width: auto; }\n  .nav-links {\n    display: flex; align-items: center; gap: 4px;\n    list-style: none; margin-right: 24px;\n  }\n  .nav-links a {\n    color: rgba(255,255,255,0.75); font-size: 14px; font-weight: 500;\n    text-decoration: none; padding: 7px 14px; border-radius: 7px;\n    transition: all 0.18s;\n  }\n  .nav-links a:hover { color: #fff; background: var(--white-dim); }\n  .nav-actions { display: flex; align-items: center; gap: 10px; }\n  .nav-actions .btn-sign { color: rgba(255,255,255,0.75); font-size: 14px; font-weight: 500; text-decoration: none; padding: 7px 14px; transition: color 0.18s; }\n  .nav-actions .btn-sign:hover { color: #fff; }\n  .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 8px; }\n  .nav-toggle span { display: block; width: 22px; height: 2px; background: #fff; margin: 5px 0; border-radius: 2px; transition: all 0.3s; }\n\n  /* ─────────────────────────────────────── HERO ─── */\n  .hero {\n    background: var(--navy);\n    min-height: 100vh;\n    display: flex; align-items: center;\n    padding-top: 88px;\n    position: relative; overflow: hidden;\n  }\n  .hero::before {\n    content: '';\n    position: absolute; inset: 0;\n    background:\n      radial-gradient(ellipse 80% 60% at 65% 40%, rgba(26,86,219,0.18) 0%, transparent 60%),\n      radial-gradient(ellipse 40% 40% at 20% 70%, rgba(26,86,219,0.08) 0%, transparent 60%);\n  }\n  /* Subtle dot grid */\n  .hero::after {\n    content: '';\n    position: absolute; inset: 0;\n    background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);\n    background-size: 32px 32px;\n    pointer-events: none;\n  }\n  .hero-inner {\n    position: relative; z-index: 2;\n    display: grid; grid-template-columns: 1fr 1fr;\n    gap: 60px; align-items: center;\n    max-width: 1160px; margin: 0 auto; padding: 80px 24px 100px;\n  }\n  .hero-left {}\n  .hero-eyebrow { margin-bottom: 24px; }\n  .hero-title { color: #fff; margin-bottom: 24px; }\n  .hero-title span { color: var(--blue-light); }\n  .hero-subtitle { font-size: 18px; color: rgba(255,255,255,0.65); line-height: 1.7; margin-bottom: 36px; max-width: 480px; }\n  .hero-ctas { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; flex-wrap: wrap; }\n  .hero-trust {\n    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;\n  }\n  .hero-trust-item {\n    display: flex; align-items: center; gap: 6px;\n    color: rgba(255,255,255,0.50); font-size: 13px; font-weight: 500;\n  }\n  .hero-trust-item svg { color: rgba(255,255,255,0.30); }\n\n  /* Hero right — floating UI mockup */\n  .hero-visual {\n    position: relative; height: 480px;\n  }\n  /* Main chat widget preview */\n  .hv-widget {\n    position: absolute; right: 0; top: 20px;\n    width: 300px;\n    background: #fff; border-radius: 16px;\n    box-shadow: 0 24px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.06);\n    overflow: hidden;\n    animation: floatA 6s ease-in-out infinite;\n  }\n  .hv-widget-header {\n    background: var(--blue);\n    padding: 14px 16px;\n    display: flex; align-items: center; gap: 10px;\n  }\n  .hv-avatar {\n    width: 32px; height: 32px; border-radius: 50%;\n    background: rgba(255,255,255,0.20);\n    display: flex; align-items: center; justify-content: center;\n    font-size: 13px; font-weight: 700; color: #fff;\n  }\n  .hv-widget-title { color: #fff; font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 600; }\n  .hv-widget-sub { color: rgba(255,255,255,0.70); font-size: 11px; }\n  .hv-close { margin-left: auto; color: rgba(255,255,255,0.60); cursor: pointer; font-size: 16px; }\n  .hv-body { padding: 14px; background: #F8FAFD; }\n  .hv-msg {\n    background: #fff; border-radius: 10px 10px 10px 2px;\n    padding: 10px 12px; font-size: 12.5px; line-height: 1.55; color: #2D3748;\n    box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 10px;\n  }\n  .hv-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }\n  .hv-chip {\n    padding: 5px 10px; border-radius: 100px;\n    border: 1px solid rgba(26,86,219,0.25); color: var(--blue);\n    font-size: 11px; font-weight: 500; background: #fff; cursor: pointer;\n    transition: all 0.15s;\n  }\n  .hv-chip:hover { background: var(--blue); color: #fff; }\n  .hv-input {\n    display: flex; align-items: center; gap: 8px;\n    background: #fff; border-radius: 8px; border: 1px solid rgba(0,0,0,0.08);\n    padding: 8px 10px;\n  }\n  .hv-input input {\n    flex: 1; border: none; outline: none; font-size: 12px; color: #999; background: none;\n    font-family: 'Inter', sans-serif;\n  }\n  .hv-send {\n    width: 26px; height: 26px; border-radius: 50%; background: var(--blue);\n    display: flex; align-items: center; justify-content: center; cursor: pointer;\n  }\n  /* Lead card */\n  .hv-lead {\n    position: absolute; left: -20px; top: 90px;\n    background: #fff; border-radius: 12px; padding: 12px 16px;\n    box-shadow: var(--shadow-card);\n    width: 230px;\n    animation: floatB 7s 1s ease-in-out infinite;\n  }\n  .hv-lead-tag { color: #10B981; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }\n  .hv-lead-tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #10B981; }\n  .hv-lead-email { font-size: 13px; font-weight: 600; color: #1A202C; margin-bottom: 2px; }\n  .hv-lead-meta { font-size: 11px; color: #999; display: flex; align-items: center; gap: 6px; }\n  .hv-lead-tag2 { background: rgba(26,86,219,0.10); color: var(--blue); font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; }\n  /* Stats pill */\n  .hv-stat {\n 002Fdiv>\n      <div class=\"tcard reveal reveal-delay-2\">\n        <p class=\"tcard-quote\">The AI actually answers questions correctly. My previous chatbot was an embarrassment. This one feels like a knowledgeable team member.<\u002Fp>\n        <div class=\"tcard-author\">\n          <div class=\"tcard-avatar\" style=\"background:linear-gradient(135deg,#4facfe,#00f2fe);\">T<\u002Fdiv>\n          <div>\n            <div class=\"tcard-name\">Tom R.<\u002Fdiv>\n            <div class=\"tcard-role\">Head of Marketing, E-commerce brand<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─── PRICING ─── -->\n<section class=\"section pricing\" id=\"pricing\">\n  <div class=\"container\">\n    <div class=\"pricing-header reveal\">\n      <div class=\"eyebrow\">Pricing<\u002Fdiv>\n      <h2>Start free. Pay only when you grow.<\u002Fh2>\n      <p style=\"color:var(--text2);font-size:17px;margin-top:12px;\">No contracts. No setup fees. Cancel any time.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"pricing-grid\">\n      <!-- Free -->\n      <div class=\"price-card reveal\">\n        <div class=\"price-tier\">FREE<\u002Fdiv>\n        <div class=\"price-amount\">\n          <span class=\"currency\">$<\u002Fspan>\n          <span class=\"amount\">0<\u002Fspan>\n          <span class=\"period\">/mo<\u002Fspan>\n        <\u002Fdiv>\n        <p class=\"price-desc\">Perfect to get started and prove the concept.<\u002Fp>\n        <div class=\"price-divider\"><\u002Fdiv>\n        <ul class=\"price-features\">\n          <li>1 website<\u002Fli>\n          <li>100 chat conversations/mo<\u002Fli>\n          <li>10 leads captured/mo<\u002Fli>\n          <li>Vera AI widget<\u002Fli>\n          <li>Basic analytics dashboard<\u002Fli>\n          <li>Veroliq branding<\u002Fli>\n        <\u002Ful>\n        <a class=\"btn btn-ghost\" href=\"#\" style=\"width:100%;justify-content:center;\">Get started free<\u002Fa>\n      <\u002Fdiv>\n      <!-- Growth (featured) -->\n      <div class=\"price-card featured reveal reveal-delay-1\">\n        <div class=\"price-badge\">MOST POPULAR<\u002Fdiv>\n        <div class=\"price-tier\">GROWTH<\u002Fdiv>\n        <div class=\"price-amount\">\n          <span class=\"currency\">$<\u002Fspan>\n          <span class=\"amount\">29<\u002Fspan>\n          <span class=\"period\">/mo<\u002Fspan>\n        <\u002Fdiv>\n        <p class=\"price-desc\">For teams serious about capturing every lead.<\u002Fp>\n        <div class=\"price-divider\"><\u002Fdiv>\n        <ul class=\"price-features\">\n          <li>Up to 5 websites<\u002Fli>\n          <li>Unlimited conversations<\u002Fli>\n          <li>Unlimited leads captured<\u002Fli>\n          <li>Remove Veroliq branding<\u002Fli>\n          <li>Full analytics &amp; export<\u002Fli>\n          <li>CRM webhook integration<\u002Fli>\n          <li>Priority email support<\u002Fli>\n        <\u002Ful>\n        <a class=\"btn btn-primary\" href=\"#\" style=\"width:100%;justify-content:center;\">Start 14-day free trial<\u002Fa>\n      <\u002Fdiv>\n      <!-- Agency -->\n      <div class=\"price-card reveal reveal-delay-2\">\n        <div class=\"price-tier\">AGENCY<\u002Fdiv>\n        <div class=\"price-amount\">\n          <span class=\"currency\">$<\u002Fspan>\n          <span class=\"amount\">79<\u002Fspan>\n          <span class=\"period\">/mo<\u002Fspan>\n        <\u002Fdiv>\n        <p class=\"price-desc\">For agencies managing multiple client websites.<\u002Fp>\n        <div class=\"price-divider\"><\u002Fdiv>\n        <ul class=\"price-features\">\n          <li>Unlimited websites<\u002Fli>\n          <li>Unlimited conversations<\u002Fli>\n          <li>White-label option<\u002Fli>\n          <li>Client management dashboard<\u002Fli>\n          <li>API access<\u002Fli>\n          <li>Custom AI behaviour rules<\u002Fli>\n          <li>Dedicated onboarding call<\u002Fli>\n        <\u002Ful>\n        <a class=\"btn btn-ghost\" href=\"#\" style=\"width:100%;justify-content:center;\">Contact sales<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"text-align:center;margin-top:32px;font-size:14px;color:var(--muted);\">\n      ✦ Early adopters get founding pricing — locked in forever.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─── FAQ ─── -->\n<section class=\"section-sm\" id=\"faq\" style=\"background:#fff;\">\n  <div class=\"container\" style=\"max-width:720px;\">\n    <div class=\"text-center reveal\" style=\"margin-bottom:48px;\">\n      <div class=\"eyebrow\">Questions &amp; answers<\u002Fdiv>\n      <h2>Everything you want to know.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"faq-list\" id=\"faq-list\">\n      <!-- items injected by JS -->\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─── CTA ─── -->\n<section class=\"cta-sec\">\n  <div class=\"container cta-inner\">\n    <div class=\"reveal\">\n      <div class=\"eyebrow\" style=\"color:var(--blue-light);margin-bottom:20px;\">Ready?<\u002Fdiv>\n      <h2>Stop letting leads slip into the silence.<\u002Fh2>\n      <p>Vera AI is live on your site in under 4 minutes.<br>No card needed. No developer required.<\u002Fp>\n      <div class=\"cta-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#\">Start free — no card needed →<\u002Fa>\n        <a class=\"btn btn-ghost-white\" href=\"#pricing\">View pricing<\u002Fa>\n      <\u002Fdiv>\n      <p class=\"cta-note\">Free plan forever · Works on any CMS · GDPR compliant<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─── FOOTER ─── -->\n<footer>\n  <div class=\"container\">\n    <div class=\"footer-grid\">\n      <div class=\"footer-brand\">\n        <img src=\"99b94cd7-c915-4afb-b3c3-50e9fddc1ae9\" alt=\"Veroliq\">\n        <p>AI-powered chat that turns anonymous visitors into named, contactable leads — automatically.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"footer-col\">\n        <h4>Product<\u002Fh4>\n        <ul>\n          <li><a href=\"#\">Features<\u002Fa><\u002Fli>\n          <li><a href=\"#\">How it works<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Pricing<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Changelog<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"footer-col\">\n        <h4>Company<\u002Fh4>\n        <ul>\n          <li><a href=\"#\">About<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Blog<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Careers<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Contact<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"footer-col\">\n        <h4>Legal<\u002Fh4>\n        <ul>\n          <li><a href=\"#\">Privacy Policy<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Terms of Service<\u002Fa><\u002Fli>\n          <li><a href=\"#\">GDPR<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Cookie Policy<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer-bottom\">\n      <p>© 2026 Veroliq. All rights reserved.<\u002Fp>\n      <div class=\"footer-bottom-links\">\n        <a href=\"#\">Twitter / X<\u002Fa>\n        <a href=\"#\">LinkedIn<\u002Fa>\n        <a href=\"#\">Status<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<!-- ─── CHAT WIDGET ─── -->\n<button class=\"chat-fab\" id=\"chat-fab\" aria-label=\"Open chat\">\n  <span class=\"fab-dot\"><\u002Fspan>\n  <svg width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n\n<div class=\"chat-window\" id=\"chat-window\">\n  <div class=\"chat-win-header\">\n    <div class=\"chat-win-avatar\">V<\u002Fdiv>\n    <div class=\"chat-win-info\">\n      <div class=\"chat-win-name\">Vera AI · Veroliq<\u002Fdiv>\n      <div class=\"chat-win-status\">You can ask me anything<\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"chat-win-close\" id=\"chat-close\">×<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"chat-messages\" id=\"chat-messages\">\n    <div class=\"msg-bot\">\n      <div class=\"chat-win-avatar\" style=\"width:26px;height:26px;font-size:10px;flex-shrink:0;\">V<\u002Fdiv>\n      <div class=\"msg-bot-bubble\">Welcome to Veroliq! I'm Vera, your AI assistant. Ask me about pricing, features, or how to get started. 👋<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"chat-starters\">\n    <button class=\"chat-starter\" onclick=\"sendStarter('What\\'s the pricing?')\">What's the pricing?<\u002Fbutton>\n    <button class=\"chat-starter\" onclick=\"sendStarter('Book a demo')\">Book a demo<\u002Fbutton>\n    <button class=\"chat-starter\" onclick=\"sendStarter('How does it work?')\">How does it work?<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"chat-input-row\">\n    <input type=\"text\" id=\"chat-input\" placeholder=\"Ask anything...\" onkeydown=\"handleKey(event)\">\n    <button class=\"chat-send\" onclick=\"sendMessage()\">\n      <svg width=\"14\" height=\"14\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.5\" viewBox=\"0 0 24 24\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"><\u002Fline><polygon points=\"22 2 15 22 11 13 2 9\"><\u002Fpolygon><\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"chat-branding\">Powered by <a href=\"#\">Veroliq<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n\n<style>\n  @keyframes spin { to { transform: rotate(360deg); } }\n<\u002Fstyle>\n\n<script>\n// ── NAV scroll ──\nconst nav = document.getElementById('main-nav');\nwindow.addEventListener('scroll', () => {\n  nav.classList.toggle('scrolled', window.scrollY > 40);\n});\nnav.classList.add('scrolled'); // Start scrolled for dark bg\n\n// ── Mobile nav ──\ndocument.getElementById('nav-toggle').addEventListener('click', () => {\n  document.getElementById('mobile-nav').classList.toggle('open');\n});\n\n// ── Scroll reveal ──\n// Mark below-fold elements as hidden; above-fold stay visible by default\nconst reveals = document.querySelectorAll('.reveal');\nconst observer = new IntersectionObserver((entries) => {\n  entries.forEach(e => {\n    if (e.isIntersecting) {\n      e.target.classList.add('visible');\n      observer.unobserve(e.target);\n    }\n  });\n}, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });\n\nfunction initReveal() {\n  reveals.forEach(el => {\n    const rect = el.getBoundingClientRect();\n    if (rect.top >= window.innerHeight) {\n      // Below fold — hide and watch\n      el.classList.add('hidden');\n      observer.observe(el);\n    }\n    // Above fold — already visible (no hidden class added)\n  });\n}\n// Run after first paint so getBoundingClientRect is reliable\nrequestAnimationFrame(() => requestAnimationFrame(initReveal));\n\n// ── FAQ ──\nconst faqs = [\n  { q: \"Does Vera AI actually understand my website content?\", a: \"Yes. Veroliq crawls all your public pages and builds a vector knowledge base. Vera answers questions based only on your real content — she won't hallucinate or make things up about your business.\" },\n  { q: \"How long does it take to set up?\", a: \"Most users go from sign-up to live widget in under 4 minutes. You paste your URL, we crawl it (usually under 60 seconds), you customise the widget, then paste one script tag into your site.\" },\n  { q: \"What if a visitor asks something Vera doesn't know?\", a: \"If Vera doesn't have a confident answer, she says so honestly and offers to connect the visitor with your team — keeping trust intact while still capturing the lead.\" },\n  { q: \"Do I need a developer to install the widget?\", a: \"No. It's a single <script> tag that works on any CMS — WordPress, Webflow, Squarespace, Framer, Wix, or custom HTML. If you can add a script to your site, you're set.\" },\n  { q: \"What happens when Vera captures a lead?\", a: \"The lead (name, email, page they visited, and conversation context) appears in your Veroliq dashboard in real time. You can export to CSV or push to your CRM via our webhook integration.\" },\n  { q: \"Is the free plan really free forever?\", a: \"Yes. The free plan includes 1 site, 100 conversations/month, and 10 leads/month — no credit card, no time limit. Upgrade when you want more volume or sites.\" },\n];\n\nconst faqList = document.getElementById('faq-list');\nfaqs.forEach((item, i) => {\n  const el = document.createElement('div');\n  el.className = 'reveal';\n  el.style.cssText = 'border-bottom:1px solid rgba(0,0,0,0.07);';\n  el.innerHTML = `\n    <button onclick=\"toggleFaq(${i})\" style=\"width:100%;text-align:left;padding:20px 0;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;\">\n      <span style=\"font-family:'Sora',sans-serif;font-size:16px;font-weight:600;color:#0C1829;\">${item.q}<\u002Fspan>\n      <svg id=\"faq-arrow-${i}\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#1A56DB\" stroke-width=\"2\" viewBox=\"0 0 24 24\" style=\"flex-shrink:0;transition:transform 0.25s;\"><polyline points=\"6 9 12 15 18 9\"/><\u002Fsvg>\n    <\u002Fbutton>\n    <div id=\"faq-ans-${i}\" style=\"overflow:hidden;max-height:0;transition:max-height 0.3s ease;\">\n      <p style=\"padding:0 0 20px;font-size:15px;color:#4A5568;line-height:1.7;\">${item.a}<\u002Fp>\n    <\u002Fdiv>\n  `;\n  faqList.appendChild(el);\n});\n\nlet openFaq = -1;\nfunction toggleFaq(i) {\n  const ans = document.getElementById('faq-ans-' + i);\n  const arrow = document.getElementById('faq-arrow-' + i);\n  if (openFaq === i) {\n    ans.style.maxHeight = '0';\n    arrow.style.transform = '';\n    openFaq = -1;\n  } else {\n    if (openFaq >= 0) {\n      document.getElementById('faq-ans-' + openFaq).style.maxHeight = '0';\n      document.getElementById('faq-arrow-' + openFaq).style.transform = '';\n    }\n    ans.style.maxHeight = ans.scrollHeight + 40 + 'px';\n    arrow.style.transform = 'rotate(180deg)';\n    openFaq = i;\n  }\n}\n\n// ── Chat widget ──\nconst chatFab = document.getElementById('chat-fab');\nconst chatWindow = document.getElementById('chat-window');\nconst chatClose = document.getElementById('chat-close');\nconst chatMessages = document.getElementById('chat-messages');\nconst chatInput = document.getElementById('chat-input');\n\nchatFab.addEventListener('click', () => { chatWindow.classList.toggle('open'); });\nchatClose.addEventListener('click', () => { chatWindow.classList.remove('open'); });\n\nconst botResponses = {\n  \"what's the pricing?\": \"We have 3 plans:\\n\\n• **Free** — $0/mo, 1 site, 100 chats, 10 leads\\n• **Growth** — $29/mo, 5 sites, unlimited everything\\n• **Agency** — $79/mo, unlimited sites, white-label\\n\\nAll plans start free. No card needed!\",\n  \"book a demo\": \"I'd love to set that up! Please leave your email and we'll reach out within 24 hours to schedule a personalised walkthrough of Veroliq. 📅\",\n  \"how does it work?\": \"It's 4 simple steps:\\n\\n1. Sign up free\\n2. Paste your website URL — we crawl it in under 60 seconds\\n3. Customise Vera's colour, name & greeting\\n4. Paste one script tag on your site — done! ✨\\n\\nLeads start arriving from day one.\",\n};\n\nfunction addMessage(text, isUser) {\n  const div = document.createElement('div');\n  div.className = isUser ? 'msg-user' : 'msg-bot';\n  const inner = document.createElement('div');\n  inner.className = isUser ? 'msg-user-bubble' : 'msg-bot-bubble';\n  inner.textContent = text;\n  if (!isUser) {\n    const avatar = document.createElement('div');\n    avatar.className = 'chat-win-avatar';\n    avatar.style.cssText = 'width:26px;height:26px;font-size:10px;flex-shrink:0;';\n    avatar.textContent = 'V';\n    div.appendChild(avatar);\n  }\n  div.appendChild(inner);\n  chatMessages.appendChild(div);\n  chatMessages.scrollTop = chatMessages.scrollHeight;\n}\n\nfunction showTyping() {\n  const div = document.createElement('div');\n  div.className = 'msg-bot';\n  div.id = 'typing-bubble';\n  div.innerHTML = `<div class=\"chat-win-avatar\" style=\"width:26px;height:26px;font-size:10px;flex-shrink:0;\">V<\u002Fdiv><div class=\"msg-bot-bubble\"><div class=\"typing-indicator\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n  chatMessages.appendChild(div);\n  chatMessages.scrollTop = chatMessages.scrollHeight;\n}\n\nfunction removeTyping() {\n  const t = document.getElementById('typing-bubble');\n  if (t) t.remove();\n}\n\nfunction getResponse(msg) {\n  const lower = msg.toLowerCase().trim();\n  for (const key in botResponses) {\n    if (lower.includes(key.replace(\"?\", \"\").toLowerCase())) return botResponses[key];\n  }\n  if (lower.includes('free') || lower.includes('cost') || lower.includes('price')) return botResponses[\"what's the pricing?\"];\n  if (lower.includes('demo') || lower.includes('call') || lower.includes('talk')) return botResponses[\"book a demo\"];\n  if (lower.includes('work') || lower.includes('setup') || lower.includes('install')) return botResponses[\"how does it work?\"];\n  return \"Great question! I'm still learning all the ins and outs. For detailed answers, our team is happy to help — just leave your email and we'll be in touch within a few hours. 📬\";\n}\n\nfunction sendStarter(text) {\n  addMessage(text, true);\n  showTyping();\n  setTimeout(() => {\n    removeTyping();\n    addMessage(getResponse(text), false);\n  }, 900 + Math.random() * 400);\n}\n\nfunction sendMessage() {\n  const text = chatInput.value.trim();\n  if (!text) return;\n  chatInput.value = '';\n  addMessage(text, true);\n  showTyping();\n  setTimeout(() => {\n    removeTyping();\n    addMessage(getResponse(text), false);\n  }, 900 + Math.random() * 500);\n}\n\nfunction handleKey(e) { if (e.key === 'Enter') sendMessage(); }\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
